name: analysis_only

# Workflow para tareas de análisis y diseño.
# Solo corre analyst + architect — sin implementación ni QA.
# Usar cuando el issue pide: análisis, diseño, README, ADRs, contexto inicial.

steps:
  - name: analyze_requirements
    agent_role: analyst
    mode: sequential
    depends_on: []
    context_keys: []
    include_input: full
    summary_artifact: problem_statement
    knowledge_sections: [decisions, agents]
    retry_max: 2

  - name: design_solution
    agent_role: architect
    mode: sequential
    depends_on: [analyze_requirements]
    include_input: summary
    context_keys: [analyst_output, user_stories, functional_requirements, acceptance_criteria]
    knowledge_sections: [decisions, standards, agents]
    retry_max: 2
