# ============================================================
# Team: dotnet-react-migration
# Proyecto: API Agrícola 2G — .NET 9 + React
# ============================================================
team:
  name: dotnet-react-migration
  description: Equipo para evolución del proyecto API Agrícola 2G (.NET 9 + React)

agents:
  - role: analyst
    profile: software_analysis
    llm:
      provider: anthropic
      model: claude-sonnet-4-6
      temperature: 0.4
      max_tokens: 4096

  - role: architect
    profile: software_architecture
    llm:
      provider: anthropic
      model: claude-sonnet-4-6
      temperature: 0.3
      max_tokens: 8192

  - role: backend_developer
    profile: api_agricola          # profile específico del proyecto
    llm:
      provider: anthropic
      model: claude-sonnet-4-6
      temperature: 0.2
      max_tokens: 8192

  - role: frontend_developer
    profile: react
    llm:
      provider: anthropic
      model: claude-sonnet-4-6
      temperature: 0.2
      max_tokens: 8192

  - role: qa
    profile: software_qa
    llm:
      provider: anthropic
      model: claude-sonnet-4-6
      temperature: 0.3
      max_tokens: 4096

workflow: software_development
