version: "3.9"

# ============================================================
# Agentic Factory — Docker Compose (MVP)
#
# Arquitectura actual: agentes corren dentro del orchestrator.
# Dos servicios: redis (estado) + orchestrator (API + agentes).
#
# Fase 2: contenedor por agente con comunicación Redis Pub/Sub.
# ============================================================

services:

  redis:
    image: redis:7-alpine
    networks: [agentic_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    networks: [agentic_net]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      TEAM_CONFIG: ${TEAM_CONFIG:-dotnet-react-migration}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Montados para actualizar sin rebuild
      - ./profiles:/app/profiles
      - ./guidelines:/app/guidelines
      - ./teams:/app/teams
      - ./workflows:/app/workflows
      # Sesión de Claude Code del host — evita re-autenticación
      - ~/.claude:/root/.claude:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  agentic_net:
    driver: bridge

volumes:
  redis_data:
